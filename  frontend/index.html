<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrisisAid - Humanitarian Platform</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #d9534f; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0275d8; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #025aa5; }
        #responseMessage { margin-top: 20px; padding: 15px; background: #dff0d8; color: #3c763d; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>CrisisAid Management Platform</h1>
    <p style="text-align: center;">Submit your emergency assistance request below.</p>
    
    <div class="form-group">
        <label for="category">Category:</label>
        <select id="category">
            <option value="Medical">Medical</option>
            <option value="Food">Food & Water</option>
            <option value="Shelter">Shelter</option>
            <option value="Rescue">Rescue</option>
        </select>
    </div>

    <div class="form-group">
        <label for="urgency">Urgency Level:</label>
        <select id="urgency">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>
    </div>

    <div class="form-group">
        <label for="description">Description (mention 'urgent' if critical for AI detection):</label>
        <textarea id="description" rows="4" placeholder="Enter details here..."></textarea>
    </div>

    <div class="form-group">
        <label for="district">District:</label>
        <select id="district">
            <option value="">-- Select District (25 Districts) --</option>
            <option value="Ampara">Ampara</option>
            <option value="Anuradhapura">Anuradhapura</option>
            <option value="Badulla">Badulla</option>
            <option value="Batticaloa">Batticaloa</option>
            <option value="Colombo">Colombo</option>
            <option value="Galle">Galle</option>
            <option value="Gampaha">Gampaha</option>
            <option value="Hambantota">Hambantota</option>
            <option value="Jaffna">Jaffna</option>
            <option value="Kalutara">Kalutara</option>
            <option value="Kandy">Kandy</option>
            <option value="Kegalle">Kegalle</option>
            <option value="Kilinochchi">Kilinochchi</option>
            <option value="Kurunegala">Kurunegala</option>
            <option value="Mannar">Mannar</option>
            <option value="Matale">Matale</option>
            <option value="Matara">Matara</option>
            <option value="Monaragala">Monaragala</option>
            <option value="Mullaitivu">Mullaitivu</option>
            <option value="Nuwara Eliya">Nuwara Eliya</option>
            <option value="Polonnaruwa">Polonnaruwa</option>
            <option value="Puttalam">Puttalam</option>
            <option value="Ratnapura">Ratnapura</option>
            <option value="Trincomalee">Trincomalee</option>
            <option value="Vavuniya">Vavuniya</option>
        </select>
    </div>

    <div class="form-group">
        <label for="nearestCity">Nearest City / Town:</label>
        <input type="text" id="nearestCity" placeholder="e.g. Matugama">
    </div>

    <div class="form-group">
        <label for="address">Specific Address:</label>
        <input type="text" id="address" placeholder="e.g. No 45, Temple Road">
    </div>

    <div class="form-group">
        <label for="contactNumber">Contact Number:</label>
        <input type="text" id="contactNumber" placeholder="e.g. 0712345678">
    </div>

    <button onclick="submitRequest()">Submit Assistance Request</button>

    <div id="responseMessage"></div>
</div>

<script>
    async function submitRequest() {
        const district = document.getElementById('district').value;
        const nearestCity = document.getElementById('nearestCity').value;
        const address = document.getElementById('address').value;
        const contactNumber = document.getElementById('contactNumber').value;
        const description = document.getElementById('description').value;

        if (!district || !nearestCity || !address || !contactNumber) {
            alert('⚠️ Please fill all required fields (District, City, Address, and Contact Number).');
            return;
        }

        const formattedLocation = `${district} District, ${nearestCity}, Address: ${address} (Contact: ${contactNumber})`;

        const data = {
            id: 0,
            category: document.getElementById('category').value,
            urgency: document.getElementById('urgency').value,
            description: description,
            location: formattedLocation,
            status: "Pending"
        };

        try {
            const response = await fetch('http://localhost:5196/api/AssistanceRequest', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                
                // 1. Popup Notification එකක් මඟින් සාර්ථක බව පෙන්වීම
                alert(`✅ Success! Your emergency assistance request has been submitted successfully.\n\nRequest ID: ${result.id}\nAI Assigned Urgency: ${result.urgency}`);

                // 2. UI එකේ Green Notification Banner එක පෙන්වීම
                const msgBox = document.getElementById('responseMessage');
                msgBox.style.display = 'block';
                msgBox.style.background = '#dff0d8';
                msgBox.style.color = '#3c763d';
                msgBox.style.border = '1px solid #d6e9c6';
                msgBox.innerHTML = `<strong>🎉 Success Notification:</strong> Request successfully submitted to the backend system! <br><b>Assigned Urgency (AI):</b> ${result.urgency} | <b>Reference ID:</b> #${result.id}`;

                // 3. අවශ්‍ය නම් Form එක Clear කරගැනීම
                document.getElementById('description').value = '';
                document.getElementById('nearestCity').value = '';
                document.getElementById('address').value = '';
                document.getElementById('contactNumber').value = '';
                document.getElementById('district').selectedIndex = 0;

            } else {
                alert('❌ Failed to submit request to backend. Please check if the API is running.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('❌ An error occurred connecting to the backend API. Make sure dotnet run is active.');
        }
    }
</script>

</body>
</html>
